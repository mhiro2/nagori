packages:
  - "apps/*"

overrides:
  chokidar: 5.0.0
  # svelte-check still relies on the TypeScript JS API, which 7.x no longer ships.
  # Keep it on 6.x until upstream supports 7.x; `tsc` itself runs on 7.x.
  svelte-check>typescript: 6.0.3

catalogs:
  frontend:
    "@sveltejs/vite-plugin-svelte": 7.3.0
    svelte: 5.56.9
    svelte-check: 4.7.6
    vite: 8.2.1
  tauri:
    "@tauri-apps/api": 2.11.1
    "@tauri-apps/cli": 2.11.4
  testing:
    "@testing-library/jest-dom": 7.0.1
    "@testing-library/svelte": 5.4.2
    "@testing-library/user-event": 14.6.4
    "@vitest/coverage-v8": 4.1.10
    jsdom: 29.1.1
    vitest: 4.1.10
  tooling:
    "@types/node": 24.13.3
    esbuild: 0.28.2
    oxfmt: 0.63.0
    oxlint: 1.78.0
    oxlint-tsgolint: 7.0.2001
    typescript: 7.0.2

# Keep the root TypeScript 7 devDependency from satisfying peer ranges in
# apps/*, so the svelte-check override above stays in effect.
resolvePeersFromWorkspaceRoot: false
blockExoticSubdeps: true
minimumReleaseAge: 10080
strictDepBuilds: true
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
