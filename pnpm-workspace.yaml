packages:
  - "apps/*"

overrides:
  chokidar: 5.0.0
  # svelte-check still relies on the TypeScript JS API, which 7.x no longer ships.
  # Keep it on 6.x until upstream supports 7.x; `tsc` itself runs on 7.x.
  svelte-check>typescript: 6.0.3

catalogs:
  frontend:
    "@sveltejs/vite-plugin-svelte": 7.3.1
    svelte: 5.57.1
    svelte-check: 4.7.6
    vite: 8.3.1
  tauri:
    "@tauri-apps/api": 2.11.1
    "@tauri-apps/cli": 2.11.5
  testing:
    "@testing-library/jest-dom": 7.0.1
    "@testing-library/svelte": 5.4.2
    "@testing-library/user-event": 14.6.7
    "@vitest/coverage-v8": 5.0.1
    jsdom: 30.1.1
    vitest: 5.0.1
  tooling:
    "@types/node": 24.13.6
    esbuild: 0.28.2
    oxfmt: 0.70.0
    oxlint: 1.85.0
    oxlint-tsgolint: 7.0.2003
    typescript: 7.0.2

# Keep the root TypeScript 7 devDependency from satisfying peer ranges in
# apps/*, so the svelte-check override above stays in effect.
resolvePeersFromWorkspaceRoot: false
# pnpm 12 otherwise prepends an environment document (packageManagerDependencies)
# to pnpm-lock.yaml, and GitHub's dependency graph reads only that first
# document, which drops every npm dependency from Dependabot alerts.
# `ignore` is the only value that keeps the single-document lockfile; the
# trade-off is that pnpm no longer switches to the `packageManager` pin locally
# (CI still pins via pnpm/setup). Remove once this is fixed:
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore
blockExoticSubdeps: true
minimumReleaseAge: 10080
strictDepBuilds: true
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
