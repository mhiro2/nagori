name: E2E (Windows)

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "scripts/e2e-windows.ps1"
      - ".github/workflows/e2e-windows.yaml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  clipboard:
    name: Clipboard E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e-windows
      - name: Build nagori CLI (release)
        run: cargo build --release -p nagori-cli
      - name: Run clipboard E2E
        run: pwsh -File scripts/e2e-windows.ps1
        env:
          NAGORI_E2E_BIN: ${{ github.workspace }}\target\release\nagori.exe
