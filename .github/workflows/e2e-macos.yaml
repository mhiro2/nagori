name: E2E (macOS)

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "apps/desktop/src-tauri/**"
      - "scripts/e2e-macos.sh"
      - ".github/workflows/e2e-macos.yaml"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  clipboard:
    name: Clipboard E2E
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: e2e-macos
      - name: Build nagori CLI (release)
        run: cargo build --release -p nagori-cli
      - name: Run clipboard E2E
        run: ./scripts/e2e-macos.sh
        env:
          NAGORI_E2E_BIN: ${{ github.workspace }}/target/release/nagori
